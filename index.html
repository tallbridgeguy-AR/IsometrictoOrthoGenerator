<script>
  const GRID_SIZE = 3;
  let grid = Array(GRID_SIZE).fill().map(() =>
    Array(GRID_SIZE).fill().map(() =>
      Array(GRID_SIZE).fill(false)
    )
  );

  const isoCanvas = document.getElementById('isoCanvas');
  const isoCtx = isoCanvas.getContext('2d');
  const orthoCanvas = document.getElementById('orthoCanvas');
  const orthoCtx = orthoCanvas.getContext('2d');

  const chkFront = document.getElementById('chkFront');
  const chkTop = document.getElementById('chkTop');
  const chkRight = document.getElementById('chkRight');
  const chkHidden = document.getElementById('chkHidden');

  function generateShape() {
    for (let x = 0; x < GRID_SIZE; x++)
      for (let y = 0; y < GRID_SIZE; y++)
        for (let z = 0; z < GRID_SIZE; z++)
          grid[x][y][z] = false;

    for (let x = 0; x < GRID_SIZE; x++) {
      for (let z = 0; z < GRID_SIZE; z++) {
        if (Math.random() > 0.3) grid[x][0][z] = true;
      }
    }
    grid[0][0][0] = true;

    for (let y = 1; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let z = 0; z < GRID_SIZE; z++) {
          if (grid[x][y - 1][z] && Math.random() > 0.5) grid[x][y][z] = true;
        }
      }
    }
    renderAll();
  }

  function drawIsometric() {
    isoCtx.clearRect(0, 0, isoCanvas.width, isoCanvas.height);

    const cubeWidth = 40;
    const cubeHeight = 40;
    const ang = Math.PI / 6;
    const cos = Math.cos(ang), sin = Math.sin(ang);

    function isoProject(x, y, z, originX, originY) {
      return [
        originX + (x - z) * (cubeWidth * cos),
        originY - y * cubeHeight + (x + z) * (cubeWidth * sin)
      ];
    }

    // compute bounds for centering
    let minX = Infinity, minY = Infinity;
    let maxX = -Infinity, maxY = -Infinity;

    // temporary origin 0 for bounds
    for (let x = 0; x <= GRID_SIZE; x++) {
      for (let y = 0; y <= GRID_SIZE; y++) {
        for (let z = 0; z <= GRID_SIZE; z++) {
          const [px, py] = isoProject(x, y, z, 0, 0);
          minX = Math.min(minX, px);
          minY = Math.min(minY, py);
          maxX = Math.max(maxX, px);
          maxY = Math.max(maxY, py);
        }
      }
    }

    const pad = 30;
    const contentW = (maxX - minX);
    const contentH = (maxY - minY);

    const originX = (isoCanvas.width - contentW) / 2 - minX + pad * 0.1;
    const originY = (isoCanvas.height - contentH) / 2 - minY + pad * 0.2;

    // painter's algorithm
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let z = GRID_SIZE - 1; z >= 0; z--) {
        for (let x = 0; x < GRID_SIZE; x++) {
          if (!grid[x][y][z]) continue;
          drawIsoCube(isoCtx, x, y, z, (cx, cy, cz) => isoProject(cx, cy, cz, originX, originY), 40);
        }
      }
    }

    // axes text
    isoCtx.font = "bold 12px sans-serif";
    isoCtx.fillStyle = "#0284c7";
    const [ax, ay] = isoProject(3, 0, 0, originX, originY);
    isoCtx.fillText("FRONT →", ax - 35, ay + 18);
  }

  function drawIsoCube(ctx, x, y, z, project) {
    const topColor = '#ffffff';
    const leftColor = '#e2e8f0';
    const rightColor = '#cbd5e1';
    const strokeColor = '#0f172a';

    const p0 = project(x, y, z);
    const p1 = project(x + 1, y, z);
    const p2 = project(x + 1, y + 1, z);
    const p3 = project(x, y + 1, z);

    const p4 = project(x, y, z + 1);
    const p5 = project(x + 1, y, z + 1);
    const p6 = project(x + 1, y + 1, z + 1);
    const p7 = project(x, y + 1, z + 1);

    // Top
    ctx.beginPath();
    ctx.moveTo(p3[0], p3[1]); ctx.lineTo(p2[0], p2[1]);
    ctx.lineTo(p6[0], p6[1]); ctx.lineTo(p7[0], p7[1]);
    ctx.closePath();
    ctx.fillStyle = topColor; ctx.fill();
    ctx.strokeStyle = strokeColor; ctx.lineWidth = 1.2; ctx.stroke();

    // Left
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]);
    ctx.closePath();
    ctx.fillStyle = leftColor; ctx.fill();
    ctx.strokeStyle = strokeColor; ctx.lineWidth = 1.2; ctx.stroke();

    // Right
    ctx.beginPath();
    ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p5[0], p5[1]);
    ctx.lineTo(p6[0], p6[1]); ctx.lineTo(p2[0], p2[1]);
    ctx.closePath();
    ctx.fillStyle = rightColor; ctx.fill();
    ctx.strokeStyle = strokeColor; ctx.lineWidth = 1.2; ctx.stroke();
  }

  function drawGridFrame(ctx, ox, oy, size, title) {
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(ox + i * size, oy);
      ctx.lineTo(ox + i * size, oy + GRID_SIZE * size);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(ox, oy + i * size);
      ctx.lineTo(ox + GRID_SIZE * size, oy + i * size);
      ctx.stroke();
    }
    ctx.font = "bold 11px sans-serif";
    ctx.fillStyle = "#64748b";
    ctx.fillText(title, ox, oy - 8);
  }

  function drawOrthoProjectionSolidFaces(ctx, ox, oy, size, viewType, showHidden) {
    // Instead of face-filling arbitrary squares, we draw the 3 visible faces edges per visible voxel
    // using a simple visibility test: front-most in that view's depth direction per (u,v).
    const cubeFill = 'rgba(2, 132, 199, 0.12)';
    const solidStroke = '#09090b';
    const hiddenStroke = '#ef4444';

    function map3DToUVDepth(x, y, z) {
      if (viewType === 'front') {
        return { u: x, v: (GRID_SIZE - 1 - y), d: z };
      } else if (viewType === 'top') {
        return { u: x, v: (GRID_SIZE - 1 - z), d: y };
      } else { // right
        return { u: (GRID_SIZE - 1 - z), v: (GRID_SIZE - 1 - y), d: x };
      }
    }

    const frontDepth = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(Infinity));
    for (let x = 0; x < GRID_SIZE; x++) {
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let z = 0; z < GRID_SIZE; z++) {
          if (!grid[x][y][z]) continue;
          const m = map3DToUVDepth(x, y, z);
          if (m.d < frontDepth[m.u][m.v]) frontDepth[m.u][m.v] = m.d;
        }
      }
    }

    function cellXY(u, v) {
      return { x: ox + u * size, y: oy + v * size };
    }

    // draw cubes far-to-near
    for (let d = GRID_SIZE - 1; d >= 0; d--) {
      for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
          for (let z = 0; z < GRID_SIZE; z++) {
            if (!grid[x][y][z]) continue;
            const m = map3DToUVDepth(x, y, z);
            if (m.d !== d) continue;

            const isHidden = (m.d !== frontDepth[m.u][m.v]);

            const { x: cx, y: cy } = cellXY(m.u, m.v);
            if (!isHidden || showHidden) {
              ctx.fillStyle = cubeFill;
              ctx.fillRect(cx, cy, size, size);
            }

            // visible block outline + "solid face" effect: solid fill with one outline per voxel
            if (isHidden) {
              if (!showHidden) continue;
              ctx.strokeStyle = hiddenStroke;
              ctx.setLineDash([5, 4]);
            } else {
              ctx.strokeStyle = solidStroke;
              ctx.setLineDash([]);
            }
            ctx.lineWidth = 2;
            ctx.strokeRect(cx, cy, size, size);
          }
        }
      }
    }
    ctx.setLineDash([]);
  }

  function drawOrthographic() {
    orthoCtx.clearRect(0, 0, orthoCanvas.width, orthoCanvas.height);
    const cellSize = 30;

    const topOrigin = { x: 80, y: 30 };
    const frontOrigin = { x: 80, y: 180 };
    const rightOrigin = { x: 280, y: 180 };

    const showHidden = chkHidden.checked;

    if (chkTop.checked) {
      drawGridFrame(orthoCtx, topOrigin.x, topOrigin.y, cellSize, "TOP VIEW");
      drawOrthoProjectionSolidFaces(orthoCtx, topOrigin.x, topOrigin.y, cellSize, 'top', showHidden);
    }
    if (chkFront.checked) {
      drawGridFrame(orthoCtx, frontOrigin.x, frontOrigin.y, cellSize, "FRONT VIEW");
      drawOrthoProjectionSolidFaces(orthoCtx, frontOrigin.x, frontOrigin.y, cellSize, 'front', showHidden);
    }
    if (chkRight.checked) {
      drawGridFrame(orthoCtx, rightOrigin.x, rightOrigin.y, cellSize, "RIGHT SIDE VIEW");
      drawOrthoProjectionSolidFaces(orthoCtx, rightOrigin.x, rightOrigin.y, cellSize, 'right', showHidden);
    }

    // alignment dashed lines
    orthoCtx.strokeStyle = '#e2e8f0';
    orthoCtx.setLineDash([2, 4]);
    if (chkTop.checked && chkFront.checked) {
      for (let i = 0; i <= 3; i++) {
        orthoCtx.beginPath();
        orthoCtx.moveTo(topOrigin.x + i * cellSize, topOrigin.y + 3 * cellSize);
        orthoCtx.lineTo(frontOrigin.x + i * cellSize, frontOrigin.y);
        orthoCtx.stroke();
      }
    }
    if (chkFront.checked && chkRight.checked) {
      for (let i = 0; i <= 3; i++) {
        orthoCtx.beginPath();
        orthoCtx.moveTo(frontOrigin.x + 3 * cellSize, frontOrigin.y + i * cellSize);
        orthoCtx.lineTo(rightOrigin.x, rightOrigin.y + i * cellSize);
        orthoCtx.stroke();
      }
    }
    orthoCtx.setLineDash([]);
  }

  function renderAll() {
    drawIsometric();
    drawOrthographic();
  }

  document.getElementById('btnNew').addEventListener('click', generateShape);
  document.getElementById('btnReset').addEventListener('click', () => {
    chkFront.checked = false;
    chkTop.checked = false;
    chkRight.checked = false;
    drawOrthographic();
  });

  [chkFront, chkTop, chkRight, chkHidden].forEach(el => el.addEventListener('change', drawOrthographic));

  generateShape();
</script>
